    <!-- Structured Data (JSON-LD WebApplication) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "文庫小説エディタ",
      "url": "https://iamthe000.github.io/kakikaki/",
      "description": "ブラウザ上で動く、A6サイズ縦書きの文庫小説エディタ。ルビ・太字・改ページに対応し、A4面付印刷用PDFやテキストの書き出しが可能です。",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "featureList": [
        "縦書きのリアルタイムプレビュー",
        "A6文庫本サイズ（105mm x 148.5mm）に完全対応",
        "青空文庫形式ルビ（《》）および注記対応",
        "A4用紙に4ページ配置する面付け（4-up）印刷・PDF保存",
        "テキストファイル（TXT）の読み込み・保存"
      ],
      "creator": {
        "@type": "Organization",
        "name": "mininium"
      }

</head>
<body>
    <header class="toolbar">
        <h1 class="brand">文庫小説エディタ</h1>
        <div class="toolbar-controls">
            <span class="status" id="status">1ページ / 0字</span>
            <button class="secondary" type="button" id="loadTextButton" title="txtファイルを読み込む">TXT読込</button>
            <button class="secondary" type="button" id="pageBreakButton" title="カーソル位置に改ページを入れる">改ページ</button>
            <button class="secondary" type="button" id="downloadTextButton" title="本文をテキストで保存する">TXT保存</button>
            <button type="button" id="printButton" title="印刷画面からPDFとして保存する">PDF保存</button>
        </div>
    </header>

    <main class="container">
        <section class="editor-pane">
            <h2 class="sr-only">執筆・エディタエリア</h2>
            <div class="editor-meta">
                <input class="title-input" id="titleInput" type="text" placeholder="作品タイトル" autocomplete="off">
                <input class="author-input" id="authorInput" type="text" placeholder="作者名" autocomplete="off">
                <button class="secondary" type="button" id="toggleSettingsButton" title="レイアウトを設定する" style="min-height: 44px; padding: 0 12px;">設定</button>
                <div class="settings-panel" id="settingsPanel">
                    <div class="settings-group">
                        <label>書体</label>
                        <select id="bodyFont">
                            <option value="mincho">明朝</option>
                            <option value="gothic">ゴシック</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>英数字</label>
                        <select id="bodyOrientation">
                            <option value="mixed">横倒し</option>
                            <option value="upright">正立</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>文字サイズ</label>
                        <select id="bodyFontSize">
                            <option value="8px">8px</option>
                            <option value="8.5px">8.5px</option>
                            <option value="9px" selected>9px</option>
                            <option value="9.5px">9.5px</option>
                            <option value="10px">10px</option>
                            <option value="11px">11px</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>面数</label>
                        <select id="printSize">
                            <option value="a6">A6 (1面)</option>
                            <option value="a4-4up">A4 (4面)</option>
                        </select>
                    </div>
                    <div style="width: 100%; height: 1px; background: var(--border-color); margin: 4px 0;"></div>
                    <div class="settings-group">
                        <label>上下</label>
                        <select id="coverPos">
                            <option value="pos-center">中央</option>
                            <option value="pos-top">上寄せ</option>
                            <option value="pos-bottom">下寄せ</option>
                            <option value="pos-split">上下分散</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>左右</label>
                        <select id="coverAlign">
                            <option value="align-center">中央</option>
                            <option value="align-right">右寄せ</option>
                            <option value="align-left">左寄せ</option>
                            <option value="align-split">左右分散</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>方向</label>
                        <select id="coverWritingMode">
                            <option value="wm-v">縦書き</option>
                            <option value="wm-h">横書き</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>題サイズ</label>
                        <select id="titleSize">
                            <option value="ts-s">小</option>
                            <option value="ts-m" selected>中</option>
                            <option value="ts-l">大</option>
                            <option value="ts-xl">特大</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>名サイズ</label>
                        <select id="authorSize">
                            <option value="as-s">小</option>
                            <option value="as-m" selected>中</option>
                            <option value="as-l">大</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>名ラベル</label>
                        <input type="text" id="authorPrefix" placeholder="著者" style="width: 60px;">
                    </div>
                </div>
            </div>
            <textarea id="editor" spellcheck="false" placeholder="ここに本文を書く&#10;&#10;ルビ: |漢字《かんじ》 / |漢字&lt;&lt;かんじ&gt;&gt;&#10;太字: **文字**, イタリック: *文字*&#10;手動改ページ: ［改ページ］"></textarea>
        </section>

        <input id="txtFileInput" type="file" accept=".txt,text/plain" hidden>

        <section class="preview-pane" id="previewPane" aria-label="A6 preview">
            <h2 class="sr-only">縦書きプレビューエリア</h2>
            <div class="pages" id="pages"></div>
        </section>
    </main>
</body>
</html>
