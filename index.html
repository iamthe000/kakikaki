<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文庫小説エディタ</title>
    <style>
        :root {
            --bg-color: #eef1f4;
            --panel-color: #ffffff;
            --paper-color: #fffefa;
            --text-color: #252525;
            --muted-color: #667085;
            --border-color: #d7dce2;
            --accent-color: #1f5fbf;
            --accent-hover: #184c99;
            --page-width: 105mm;
            --page-height: 148mm;
            --page-pad-y: 13mm;
            --page-pad-x: 11mm;
            --body-font-size: 9px;
            --body-line-height: 1.75;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .toolbar {
            min-height: 58px;
            padding: 10px 18px;
            background: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 2px 10px rgba(31, 41, 55, 0.06);
            z-index: 5;
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status {
            color: var(--muted-color);
            font-size: 0.84rem;
            margin-right: 6px;
            white-space: nowrap;
        }

        button {
            min-height: 44px;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 10px 14px;
            background: var(--accent-color);
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1;
            touch-action: manipulation;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: #ffffff;
            color: #27364a;
            border-color: var(--border-color);
        }

        button.secondary:hover {
            background: #f5f7fa;
        }

        .container {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(320px, 0.95fr) minmax(420px, 1.1fr);
        }

        .editor-pane {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--panel-color);
            border-right: 1px solid var(--border-color);
        }

        .editor-meta {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .title-input {
            flex: 1 1 240px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--text-color);
            font: inherit;
            outline: none;
            touch-action: manipulation;
        }

        .author-input {
            flex: 1 1 180px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--text-color);
            font: inherit;
            outline: none;
            touch-action: manipulation;
        }

        .title-input:focus,
        .author-input:focus,
        textarea:focus {
            border-color: #8bb4ef;
            box-shadow: 0 0 0 3px rgba(31, 95, 191, 0.12);
        }

        textarea {
            flex: 1;
            width: 100%;
            min-height: 0;
            padding: 16px;
            border: 0;
            resize: none;
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            font-size: 9px;
            line-height: 1.75;
            outline: none;
            touch-action: manipulation;
        }

        .preview-pane {
            min-width: 0;
            min-height: 0;
            padding: 30px;
            overflow: auto;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.48), rgba(255,255,255,0)),
                var(--bg-color);
            direction: rtl;
        }

        .pages {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 16mm;
            width: max-content;
            min-height: 100%;
            direction: rtl;
        }

        .page {
            position: relative;
            flex: 0 0 var(--page-width);
            width: var(--page-width);
            height: var(--page-height);
            padding: var(--page-pad-y) var(--page-pad-x);
            overflow: hidden;
            background: var(--paper-color);
            box-shadow: 0 10px 28px rgba(31, 41, 55, 0.17);
            direction: ltr;
        }

        .page::after {
            content: attr(data-page);
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3.5mm;
            color: #9aa3af;
            font-size: 7pt;
            line-height: 1;
            text-align: center;
            writing-mode: horizontal-tb;
            direction: ltr;
            pointer-events: none;
        }

        .page-content {
            width: 100%;
            height: 100%;
            overflow: hidden;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: #1f1f1f;
            font-family: "Yu Mincho", "Noto Serif JP", "Hiragino Mincho ProN", "BIZ UDPMincho", serif;
            font-size: var(--body-font-size);
            line-height: var(--body-line-height);
            letter-spacing: 0;
            line-break: strict;
            overflow-wrap: normal;
            word-break: normal;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .page-content p {
            margin: 0;
            text-indent: 0;
        }

        .page-content p.empty-line {
            min-width: 1em;
        }

        .cover-layout {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 8mm;
            padding: 10mm 0;
        }

        .cover-title {
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.4;
        }

        .cover-author {
            font-size: 1.05em;
            letter-spacing: 0.12em;
        }

        .page-content ruby {
            ruby-align: center;
        }

        .page-content rt {
            font-size: 0.48em;
            line-height: 1;
            letter-spacing: 0;
        }

        .bold {
            font-weight: 700;
        }

        .pagination-workbench {
            position: fixed;
            left: -10000px;
            top: 0;
            width: max-content;
            visibility: hidden;
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 920px) {
            :root {
                --page-width: calc(100vw - 24px);
                --page-height: calc((100vw - 24px) * 1.4095238);
            }

            body {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                position: sticky;
                top: 0;
            }

            .brand {
                white-space: normal;
            }

            .toolbar-controls {
                justify-content: stretch;
            }

            .toolbar-controls > * {
                flex: 1 1 140px;
            }

            .container {
                display: block;
            }

            .editor-pane {
                min-height: 46vh;
                border-right: 0;
                border-bottom: 1px solid var(--border-color);
            }

            .editor-meta {
                gap: 8px;
            }

            .title-input,
            .author-input {
                flex-basis: 100%;
                width: 100%;
            }

            textarea {
                min-height: 38vh;
                padding: 14px;
            }

            .preview-pane {
                min-height: 54vh;
                padding: 12px;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                direction: rtl;
            }

            .pages {
                width: max-content;
                gap: 14px;
                align-items: center;
                direction: rtl;
            }

            .page {
                width: var(--page-width);
                height: var(--page-height);
                flex-shrink: 0;
                scroll-snap-align: center;
            }

            .page::after {
                bottom: 2.8mm;
            }
        }

        @media print {
            @page {
                size: 105mm 148mm;
                margin: 0;
            }

            html,
            body {
                width: 105mm;
                min-height: 148mm;
                background: #ffffff;
                overflow: visible;
            }

            .toolbar,
            .editor-pane {
                display: none !important;
            }

            .container,
            .preview-pane {
                display: block;
                width: 105mm;
                min-height: 148mm;
                padding: 0;
                margin: 0;
                overflow: visible;
                background: #ffffff;
                direction: ltr;
            }

            .pages {
                display: block;
                width: 105mm;
                min-height: 0;
                gap: 0;
                direction: ltr;
            }

            .page {
                display: block;
                width: 105mm;
                height: 148mm;
                padding: var(--page-pad-y) var(--page-pad-x);
                margin: 0;
                overflow: hidden;
                background: #ffffff;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
            }

            .page:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .page::after {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="brand">文庫小説エディタ</div>
        <div class="toolbar-controls">
            <span class="status" id="status">1ページ / 0字</span>
            <button class="secondary" type="button" id="loadTextButton" title="txtファイルを読み込む">TXT読込</button>
            <button class="secondary" type="button" id="pageBreakButton" title="カーソル位置に改ページを入れる">改ページ</button>
            <button class="secondary" type="button" id="downloadTextButton" title="本文をテキストで保存する">TXT保存</button>
            <button type="button" id="printButton" title="印刷画面からPDFとして保存する">PDF保存</button>
        </div>
    </header>

    <main class="container">
        <section class="editor-pane">
            <div class="editor-meta">
                <input class="title-input" id="titleInput" type="text" placeholder="作品タイトル" autocomplete="off">
                <input class="author-input" id="authorInput" type="text" placeholder="作者名" autocomplete="off">
            </div>
            <textarea id="editor" spellcheck="false" placeholder="ここに本文を書く&#10;&#10;ルビ: |漢字《かんじ》 / |漢字&lt;&lt;かんじ&gt;&gt;&#10;太字: **文字**&#10;手動改ページ: ［改ページ］"></textarea>
        </section>

        <input id="txtFileInput" type="file" accept=".txt,text/plain" hidden>

        <section class="preview-pane" id="previewPane" aria-label="A6 preview">
            <div class="pages" id="pages"></div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = 'bunko-novel-editor:v4';
        const PAGE_BREAK_PATTERN = /^\s*(?:［改ページ］|\[page\]|={3,}|-{3,})\s*$/i;
        const DEFAULT_TEXT = [
            '　ここから本文を書き始めます。',
            '',
            '　このエディタはA6文庫サイズで縦書きに組み、ページごとに左右の余白を持たせます。',
            '',
            '　ルビは|漢字《かんじ》や|漢字<<かんじ>>、強調は**太字**で書けます。',
            '［改ページ］',
            '　改ページを入れると、次のA6ページに続きます。'
        ].join('\n');

        const editor = document.getElementById('editor');
        const titleInput = document.getElementById('titleInput');
        const authorInput = document.getElementById('authorInput');
        const previewPane = document.getElementById('previewPane');
        const statusText = document.getElementById('status');
        const loadTextButton = document.getElementById('loadTextButton');
        const pageBreakButton = document.getElementById('pageBreakButton');
        const downloadTextButton = document.getElementById('downloadTextButton');
        const printButton = document.getElementById('printButton');
        const txtFileInput = document.getElementById('txtFileInput');

        let renderTimer = 0;

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (saved && typeof saved.text === 'string') {
                    titleInput.value = saved.title || '';
                    authorInput.value = saved.author || '';
                    editor.value = saved.text;
                    return;
                }
            } catch (error) {
                console.warn('保存データを読めませんでした。', error);
            }
            editor.value = DEFAULT_TEXT;
        }

        function saveState() {
            const payload = {
                title: titleInput.value,
                author: authorInput.value,
                text: editor.value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        }

        function normalizeText(text) {
            return text.replace(/\r\n?/g, '\n');
        }

        function visibleCharacterCount(text) {
            return normalizeText(text)
                .split('\n')
                .filter(line => !PAGE_BREAK_PATTERN.test(line))
                .join('')
                .replace(/\|([^《<>]+)(?:《([^》]+)》|<<([^>]+)>>)/g, '$1')
                .replace(/\*\*([^*]+)\*\*/g, '$1')
                .replace(/\s/g, '').length;
        }

        function createPage(pagesElement) {
            const page = document.createElement('article');
            page.className = 'page';

            const content = document.createElement('div');
            content.className = 'page-content';
            page.appendChild(content);
            pagesElement.appendChild(page);

            return { page, content };
        }

        function createCoverPage(pagesElement) {
            const page = document.createElement('article');
            page.className = 'page';

            const content = document.createElement('div');
            content.className = 'page-content';

            const cover = document.createElement('div');
            cover.className = 'cover-layout';

            const title = document.createElement('div');
            title.className = 'cover-title';
            title.textContent = titleInput.value.trim();

            const author = document.createElement('div');
            author.className = 'cover-author';
            author.textContent = authorInput.value.trim() ? `著者　${authorInput.value.trim()}` : '';

            if (title.textContent === '' && author.textContent === '') {
                return null;
            }

            cover.appendChild(title);
            if (author.textContent !== '') {
                cover.appendChild(author);
            }
            content.appendChild(cover);
            page.appendChild(content);
            pagesElement.appendChild(page);
            return page;
        }

        function overflows(content) {
            return content.scrollWidth > content.clientWidth + 1 || content.scrollHeight > content.clientHeight + 1;
        }

        function createTokenNode(token) {
            if (token.type === 'br') {
                return document.createElement('br');
            }

            if (token.type === 'ruby') {
                const ruby = document.createElement('ruby');
                appendInlineTokens(ruby, parseInline(token.base));
                const rt = document.createElement('rt');
                appendInlineTokens(rt, parseInline(token.reading));
                ruby.appendChild(rt);
                return ruby;
            }

            if (token.bold) {
                const span = document.createElement('span');
                span.className = 'bold';
                appendInlineTokens(span, parseInline(token.text));
                return span;
            }

            return document.createTextNode(token.text);
        }

        function appendInlineTokens(parent, tokens) {
            const fragment = document.createDocumentFragment();
            for (const token of tokens) {
                fragment.appendChild(createTokenNode(token));
            }
            parent.appendChild(fragment);
        }

        function appendTokenRange(parent, tokens, start, count) {
            const fragment = document.createDocumentFragment();
            for (let i = start; i < start + count; i += 1) {
                fragment.appendChild(createTokenNode(tokens[i]));
            }
            parent.appendChild(fragment);
        }

        function setTokenRange(parent, tokens, start, count) {
            parent.replaceChildren();
            appendTokenRange(parent, tokens, start, count);
        }

        function maxFittingCount(paragraph, content, tokens, start, count) {
            let low = 0;
            let high = count;
            let best = 0;

            while (low <= high) {
                const mid = Math.floor((low + high) / 2);
                setTokenRange(paragraph, tokens, start, mid);

                if (overflows(content)) {
                    high = mid - 1;
                } else {
                    best = mid;
                    low = mid + 1;
                }
            }

            paragraph.replaceChildren();
            return best;
        }

        function parseInline(text) {
            const tokens = [];
            const chars = Array.from(text);
            let buffer = '';

            function flushText() {
                if (buffer !== '') {
                    tokens.push({ type: 'text', text: buffer });
                    buffer = '';
                }
            }

            for (let i = 0; i < chars.length; i += 1) {
                if (chars[i] === '\n') {
                    flushText();
                    tokens.push({ type: 'br' });
                    continue;
                }

                if (chars[i] === '|' && chars[i + 1]) {
                    const angleOpen = chars.indexOf('《', i + 1);
                    let chevronOpen = -1;
                    for (let j = i + 1; j < chars.length - 1; j += 1) {
                        if (chars[j] === '<' && chars[j + 1] === '<') {
                            chevronOpen = j;
                            break;
                        }
                    }

                    let openIndex = -1;
                    let openPattern = null;
                    if (angleOpen !== -1 && (chevronOpen === -1 || angleOpen < chevronOpen)) {
                        openIndex = angleOpen;
                        openPattern = '《';
                    } else if (chevronOpen !== -1) {
                        openIndex = chevronOpen;
                        openPattern = '<<';
                    }

                    if (openPattern && openIndex > i + 1) {
                        flushText();
                        const base = chars.slice(i + 1, openIndex).join('');
                        const readingStart = openIndex + (openPattern === '<<' ? 2 : 1);
                        let close = -1;

                        if (openPattern === '<<') {
                            for (let j = readingStart; j < chars.length - 1; j += 1) {
                                if (chars[j] === '>' && chars[j + 1] === '>') {
                                    close = j;
                                    break;
                                }
                            }
                        } else {
                            close = chars.indexOf('》', readingStart);
                        }

                        if (close > readingStart) {
                            tokens.push({
                                type: 'ruby',
                                base,
                                reading: chars.slice(readingStart, close).join('')
                            });
                            i = close + (openPattern === '<<' ? 1 : 0);
                            continue;
                        }
                    }
                }

                if (chars[i] === '*' && chars[i + 1] === '*') {
                    const close = chars.findIndex((char, index) => index > i + 1 && char === '*' && chars[index + 1] === '*');
                    if (close > i + 1) {
                        flushText();
                        tokens.push({ type: 'bold', text: chars.slice(i + 2, close).join('') });
                        i = close + 1;
                        continue;
                    }
                }

                buffer += chars[i];
            }

            flushText();
            return tokens;
        }

        function parseBlocks(text) {
            const lines = normalizeText(text).split('\n');
            const blocks = [];
            let paragraph = [];
            let skipNextBlank = false;

            function flushParagraph() {
                if (paragraph.length > 0) {
                    blocks.push({ type: 'paragraph', text: paragraph.join('\n') });
                    paragraph = [];
                }
            }

            for (const line of lines) {
                if (PAGE_BREAK_PATTERN.test(line)) {
                    flushParagraph();
                    blocks.push({ type: 'page-break' });
                    skipNextBlank = true;
                    continue;
                }

                if (line.trim() === '') {
                    if (skipNextBlank) {
                        skipNextBlank = false;
                        continue;
                    }
                    flushParagraph();
                    blocks.push({ type: 'blank' });
                    continue;
                }

                skipNextBlank = false;
                paragraph.push(line);
            }

            flushParagraph();
            return blocks;
        }

        function paginate(text) {
            const workbench = document.createElement('div');
            workbench.className = 'pagination-workbench';

            const pagesElement = document.createElement('div');
            pagesElement.className = 'pages';
            pagesElement.id = 'pages';
            workbench.appendChild(pagesElement);
            document.body.appendChild(workbench);

            createCoverPage(pagesElement);
            let current = null;

            function ensurePage() {
                if (!current) {
                    current = createPage(pagesElement);
                }
            }

            function pageIsEmpty() {
                return !current || (current.content.textContent === '' && !current.content.querySelector('br, ruby'));
            }

            function nextPage() {
                current = createPage(pagesElement);
            }

            function addBlankLine() {
                ensurePage();
                const paragraph = document.createElement('p');
                paragraph.className = 'empty-line';
                paragraph.appendChild(document.createElement('br'));
                current.content.appendChild(paragraph);

                if (overflows(current.content)) {
                    current.content.removeChild(paragraph);
                    nextPage();
                    current.content.appendChild(paragraph);
                }
            }

            function addParagraph(textValue) {
                ensurePage();
                const tokens = parseInline(textValue);
                let index = 0;

                while (index < tokens.length) {
                    const paragraph = document.createElement('p');
                    current.content.appendChild(paragraph);

                    const remaining = tokens.length - index;
                    appendTokenRange(paragraph, tokens, index, remaining);

                    if (!overflows(current.content)) {
                        index = tokens.length;
                        continue;
                    }

                    paragraph.replaceChildren();
                    const fitCount = maxFittingCount(paragraph, current.content, tokens, index, remaining);

                    if (fitCount === 0) {
                        current.content.removeChild(paragraph);
                        if (pageIsEmpty()) {
                            current.content.appendChild(paragraph);
                            appendTokenRange(paragraph, tokens, index, 1);
                            index += 1;
                        }
                        nextPage();
                        continue;
                    }

                    appendTokenRange(paragraph, tokens, index, fitCount);
                    index += fitCount;

                    if (index < tokens.length) {
                        nextPage();
                    }
                }
            }

            for (const block of parseBlocks(text)) {
                if (block.type === 'page-break') {
                    if (!pageIsEmpty()) {
                        nextPage();
                    }
                    continue;
                }

                if (block.type === 'blank') {
                    addBlankLine();
                    continue;
                }

                addParagraph(block.text);
            }

            const pages = Array.from(pagesElement.children);
            if (pages.length === 0) {
                createPage(pagesElement);
            }

            Array.from(pagesElement.children).forEach((page, index) => {
                page.dataset.page = String(index + 1);
            });

            workbench.remove();
            return pagesElement;
        }

        function renderPreview() {
            const pagesElement = paginate(editor.value);
            previewPane.replaceChildren(pagesElement);

            const pageCount = pagesElement.children.length;
            const charCount = visibleCharacterCount(editor.value);
            statusText.textContent = `${pageCount}ページ / ${charCount.toLocaleString('ja-JP')}字`;
        }

        function queueRender() {
            window.clearTimeout(renderTimer);
            renderTimer = window.setTimeout(() => {
                renderPreview();
            }, 40);
        }

        function insertAtCursor(value) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const before = editor.value.slice(0, start);
            const after = editor.value.slice(end);
            const prefix = before.endsWith('\n') || before.length === 0 ? '' : '\n';
            const suffix = after.startsWith('\n') || after.length === 0 ? '' : '\n';
            const insertion = `${prefix}${value}${suffix}`;

            editor.value = before + insertion + after;
            const cursor = before.length + insertion.length;
            editor.focus();
            editor.setSelectionRange(cursor, cursor);
            saveState();
            queueRender();
        }

        function downloadText() {
            const title = (titleInput.value.trim() || 'novel').replace(/[\\/:*?"<>|]/g, '_');
            const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = `${title}.txt`;
            anchor.click();
            URL.revokeObjectURL(anchor.href);
        }

        function loadTextFile() {
            txtFileInput.value = '';
            txtFileInput.click();
        }

        txtFileInput.addEventListener('change', async () => {
            const file = txtFileInput.files && txtFileInput.files[0];
            if (!file) {
                return;
            }

            const text = await file.text();
            editor.value = normalizeText(text);
            saveState();
            queueRender();
        });

        async function printNovel() {
            saveState();
            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
            }
            renderPreview();
            const title = titleInput.value.trim();
            document.title = title ? `${title} - 文庫小説エディタ` : '文庫小説エディタ';
            requestAnimationFrame(() => window.print());
        }

        editor.addEventListener('input', () => {
            saveState();
            queueRender();
        });

        titleInput.addEventListener('input', saveState);
        authorInput.addEventListener('input', saveState);
        loadTextButton.addEventListener('click', loadTextFile);
        pageBreakButton.addEventListener('click', () => insertAtCursor('［改ページ］'));
        downloadTextButton.addEventListener('click', downloadText);
        printButton.addEventListener('click', printNovel);
        window.addEventListener('beforeprint', renderPreview);

        loadState();
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(renderPreview);
        } else {
            renderPreview();
        }
    </script>
</body>
</html>
